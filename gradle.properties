# Done to increase the memory available to Gradle.
org.gradle.jvmargs=-Xmx4G
# Stonecutter はアクティブバージョン切り替えでルート src/ を書き換えるため、
# 並列実行との組み合わせが安全か未検証。Phase 4（2本目投入）で検証してから戻す。
# 詳細は memo/STONECUTTER-TODO.md の「同時ビルド / 排他制御」を参照。
org.gradle.parallel=false
# Mod properties
mod_version=0.0.5
maven_group=net.pitan76
archives_name=assetbridge
enabled_platforms=fabric,forge
# Minecraft and loader versions are per-node: see <branch>/versions/<mc>/gradle.properties.
# Deliberately absent here so a missing node property fails loudly instead of
# silently falling back to some other version's value.
