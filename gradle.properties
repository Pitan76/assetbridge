# Done to increase the memory available to Gradle.
org.gradle.jvmargs=-Xmx4G
# Verified with two versions registered: a clean parallel chiseledBuild produces the
# correct per-version code and metadata in every jar. The controller also serialises
# `build` across nodes via `stonecutter tasks { order("build") }`.
# The remaining hazard is running a version switch while another Gradle process (an
# IDE sync) is building -- process discipline, not a Gradle setting.
# See memo/STONECUTTER-TODO.md, "同時ビルド / 排他制御".
org.gradle.parallel=true
# Mod properties
mod_version=0.0.6
maven_group=net.pitan76
archives_name=assetbridge
enabled_platforms=fabric,forge
# Minecraft and loader versions are per-node: see <branch>/versions/<mc>/gradle.properties.
# Deliberately absent here so a missing node property fails loudly instead of
# silently falling back to some other version's value.
