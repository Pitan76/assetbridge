modLoader = "javafml"
loaderVersion = "${forge_loader_dep}"
#issueTrackerURL = ""
license = "MIT"

[[mods]]
modId = "assetbridge"
version = "${version}"
displayName = "Asset Bridge "
authors = "Pitan"
description = '''
A Minecraft mod that loads assets such as blocks from other mods, allowing them to be used visually without their original functionality.
'''
#logoFile = ""

[[dependencies.assetbridge]]
modId = "forge"
mandatory = true
versionRange = "${forge_loader_dep}"
ordering = "NONE"
side = "BOTH"

[[dependencies.assetbridge]]
modId = "minecraft"
mandatory = true
versionRange = "${mc_dep}"
ordering = "NONE"
side = "BOTH"

