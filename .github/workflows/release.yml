name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish_targets:
        description: |
          アップロードするターゲットをカンマ区切りで指定 (例: fabric:1.21.1,forge:1.16.5,neoforge:26.1.2)
          空欄にすると publishMods を全実行します
        required: false
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: gradle

      - uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew chiseledBuild

      - name: Publish to CurseForge and Modrinth
        run: |
          TARGETS="${{ github.event.inputs.publish_targets }}"
          if [ -z "$TARGETS" ]; then
            # タグpushや入力が空の場合は全バージョンをpublish
            ./gradlew publishMods --continue
          else
            # カンマ区切りで指定されたターゲットだけ実行
            # 例: "fabric:1.21.1,forge:1.16.5" → ":fabric:1.21.1:publishMods :forge:1.16.5:publishMods"
            TASKS=""
            IFS=',' read -ra ENTRIES <<< "$TARGETS"
            for ENTRY in "${ENTRIES[@]}"; do
              LOADER=$(echo "$ENTRY" | cut -d: -f1 | xargs)
              VERSION=$(echo "$ENTRY" | cut -d: -f2 | xargs)
              TASKS="$TASKS :$LOADER:$VERSION:publishMods"
            done
            echo "実行するタスク:$TASKS"
            ./gradlew $TASKS --continue
          fi
        continue-on-error: true
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}

      - name: Create Release
        # タグpushのときだけGitHub Releaseを作成する
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            fabric/versions/*/build/libs/*.jar
            forge/versions/*/build/libs/*.jar
            neoforge/versions/*/build/libs/*.jar
          body: |
            ${{ github.event.head_commit.message }}
          generate_release_notes: true
